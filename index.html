<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>课堂英雄</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;min-height:100vh;background:linear-gradient(135deg,#FFFBEB,#FFF0F5,#F0F9FF);padding:16px}
.ttl{font-size:1.5rem;font-weight:900;background:linear-gradient(135deg,#F9C74F,#E63946,#9B5DE5);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.crd{background:#fff;border-radius:1rem;box-shadow:0 4px 20px rgba(0,0,0,.08);border:4px solid;padding:16px;margin-bottom:16px}
.cy{border-color:#F9C74F}.cb{border-color:#457B9D}.cg{border-color:#2A9D8F}.cp{border-color:#9B5DE5}.co{border-color:#F4A261}.cpk{border-color:#F15BB5}
.btn{padding:8px 16px;border-radius:999px;font-weight:700;font-size:.8rem;border:3px solid;cursor:pointer;margin:4px}
.bp{background:#457B9D;color:#fff;border-color:#2d5a75}.bs{background:#2A9D8F;color:#fff;border-color:#1e756a}
.bd{background:#E63946;color:#fff;border-color:#b82d38}.bpu{background:#9B5DE5;color:#fff;border-color:#7a4ab8}
.bgr{background:#6B7280;color:#fff;border-color:#4B5563}
.inp{width:100%;padding:12px;border:3px solid #D1D5DB;border-radius:.5rem;font-size:1rem;margin-bottom:12px}
.inp:focus{outline:none;border-color:#457B9D}
.fx{display:flex}.fc{flex-direction:column}.fw{flex-wrap:wrap}.ac{align-items:center}.jc{justify-content:center}.jb{justify-content:space-between}
.mb{margin-bottom:16px}.tc{text-align:center}.f1{flex:1}
.tgr{color:#6B7280}.tbl{color:#457B9D}.tgn{color:#2A9D8F}.tpu{color:#9B5DE5}.tor{color:#F4A261}.tye{color:#92400E}
.icb{display:inline-flex;align-items:center;justify-content:center;width:2rem;height:2rem;border-radius:50%;color:#fff;margin-right:8px}
.mdo{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.mdc{background:#fff;border-radius:1rem;border:4px solid;padding:24px;width:100%;max-width:400px;max-height:90vh;overflow-y:auto}
.cnt{max-width:900px;margin:0 auto}
.nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.nav button{padding:8px 12px;border-radius:999px;font-weight:700;font-size:.7rem;border:3px solid;cursor:pointer;background:#fff}
.nav button.active{color:#fff}
.acr{background:#F9FAFB;border-radius:.5rem;padding:12px;border:2px solid #E5E7EB;margin-bottom:8px}
.cin{width:50px;text-align:center;font-weight:800;padding:4px;border:2px solid #93C5FD;border-radius:.25rem}
.lbi{border-radius:1rem;padding:12px;border:4px solid;margin-bottom:8px}
.scb{background:#F9C74F;border-radius:999px;padding:4px 12px;border:2px solid #B45309;font-weight:900;color:#92400E}
.clb{width:32px;height:32px;border-radius:.25rem;border:3px solid #D1D5DB;cursor:pointer}.clb.sel{border-color:#000}
.bgr-c{background:#E63946}.bgo-c{background:#F4A261}.bgy-c{background:#F9C74F}.bgg-c{background:#2A9D8F}.bgb-c{background:#457B9D}.bgp-c{background:#9B5DE5}.bgk-c{background:#F15BB5}
.ddm{position:absolute;top:100%;left:0;background:#fff;border-radius:.5rem;box-shadow:0 10px 40px rgba(0,0,0,.15);border:2px solid #F9C74F;z-index:40;min-width:180px}
.ddi{padding:10px 16px;cursor:pointer;border:none;background:none;width:100%;text-align:left;font-size:.875rem}.ddi:hover{background:#FEF3C7}
.stli{background:#fff;border:2px solid #E5E7EB;border-radius:.5rem;padding:12px;cursor:pointer;text-align:center;margin:4px}.stli:hover{border-color:#F15BB5}
.mtx{overflow-x:auto}.mtx table{border-collapse:collapse;width:100%}.mtx th,.mtx td{padding:6px;border:1px solid #E5E7EB;font-size:.7rem}.mtx th{background:#F3F4F6}
.mtx .hasv{background:#D1FAE5;color:#2A9D8F}.mtx .total-row{background:#FEF3C7}.mtx .total-col{background:#FEF3C7;color:#92400E}
</style>
</head>
<body>
<div id="app"></div>
<script>
const T={appTitle:"课堂英雄",login:"登录",logout:"退出",username:"用户名",password:"密码",teacherName:"教师姓名",createTeacher:"创建账户",students:"学生",addStudent:"添加学生",importStudents:"导入",activities:"活动",addActivity:"添加活动",points:"分",total:"总计",save:"保存",cancel:"取消",noActivities:"还没有活动",noStudents:"还没有学生",addClass:"添加班级",className:"班级名称",noClasses:"没有班级",welcomeMessage:"欢迎！创建班级开始",createFirstClass:"创建班级",switchClass:"切换班级",exportData:"导出",importData:"导入",dataExported:"导出成功！",dataImported:"导入成功！",invalidFile:"无效文件",showAll:"全部",filterBy:"筛选",leaderboard:"排行榜",teacherMode:"管理",classOverview:"概览",studentProgress:"进度",selectStudent:"选择学生",noHistory:"暂无记录",dailyTotal:"每日总计",back:"返回",activityName:"活动名称",pointValue:"分值",icon:"图标",color:"颜色",pasteHere:"粘贴姓名",backupTitle:"备份提醒",backupMessage:"数据存在浏览器，建议备份",backupNow:"下载",backupLater:"稍后"};
const IC={Star:"⭐",Trophy:"🏆",Book:"📚",Sparkles:"✨",Award:"🎖️",Users:"👥"};
const CO=['bgb-c','bgg-c','bgp-c','bgo-c','bgr-c','bgk-c','bgy-c'];
let S={loggedIn:0,user:null,data:{activeClassId:null,classes:[],changes:0,lastBackup:0},view:'manage',selStu:null,filter:'all',showDD:0,modal:null,edit:null,form:{cls:{name:'',color:'bgb-c'},stu:'',imp:'',act:{name:'',icon:'Star',color:'bgb-c',pts:10}},login:{u:'',p:''},reg:{n:'',u:'',p:''}};
const $=id=>document.getElementById(id),gCls=()=>S.data.classes.find(c=>c.id===S.data.activeClassId),gSts=()=>gCls()?.students||[],gActs=()=>gCls()?.activities||[],
cTS=s=>gActs().reduce((t,a)=>t+((s?.activityCounts?.[a.id]||0)*a.pointValue),0),
save=()=>S.loggedIn&&S.user&&localStorage.setItem('ch_'+S.user.id,JSON.stringify({...S.data,lastUpdated:Date.now()})),
load=()=>{if(!localStorage.getItem('chS'))localStorage.setItem('chS',JSON.stringify({teachers:[]}));if(S.user){const d=localStorage.getItem('ch_'+S.user.id);if(d){const p=JSON.parse(d);S.data={activeClassId:p.activeClassId||null,classes:(p.classes||[]).map(c=>({...c,students:(c.students||[]).map(s=>({...s,activityCounts:s.activityCounts||{},activityHistory:s.activityHistory||{}}))})),changes:p.changes||0,lastBackup:p.lastBackup||0}}}},
inc=()=>{S.data.changes++;if(S.data.changes>=15&&S.data.changes-S.data.lastBackup>=15){S.modal='backup';render()}save()},
getDate=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};

function render(){const app=$('app');if(!S.loggedIn){app.innerHTML=renderLogin()}else if(!gCls()){app.innerHTML=renderWelcome()}else{app.innerHTML=renderMain()}bindEvents()}

function renderLogin(){return`<div class="tc mb"><h1 class="ttl">⭐ ${T.appTitle} ⭐</h1></div><div class="cnt"><div class="fx fw" style="gap:16px"><div class="crd cb f1" style="min-width:280px"><h2 class="tbl tc mb">🔒 ${T.login}</h2><form id="loginForm"><input class="inp" id="lu" placeholder="${T.username}" value="${S.login.u}"><input class="inp" id="lp" type="password" placeholder="${T.password}" value="${S.login.p}"><button class="btn bp" style="width:100%">${T.login}</button></form></div><div class="crd cg f1" style="min-width:280px"><h2 class="tgn tc mb">✨ ${T.createTeacher}</h2><form id="regForm"><input class="inp" id="rn" placeholder="${T.teacherName}" value="${S.reg.n}"><input class="inp" id="ru" placeholder="${T.username}" value="${S.reg.u}"><input class="inp" id="rp" type="password" placeholder="${T.password}" value="${S.reg.p}"><button class="btn bs" style="width:100%">${T.createTeacher}</button></form></div></div></div>`}

function renderWelcome(){return`<div class="tc mb"><h1 class="ttl">⭐ ${T.appTitle} ⭐</h1><button class="btn bd" id="logout" style="position:absolute;top:16px;right:16px">🚪</button></div><div class="cnt" style="max-width:500px"><div class="crd cy tc"><div style="font-size:3rem">🎉🏫🎉</div><h2 class="ttl mb">${T.welcomeMessage}</h2><button class="btn bs" id="firstCls">📁 ${T.createFirstClass}</button></div></div>${renderModals()}`}

function renderMain(){const cls=gCls();return`<div class="tc mb"><div class="fx jb ac cnt"><div class="f1"></div><h1 class="ttl f1 tc">⭐ ${T.appTitle} ⭐</h1><div class="f1" style="text-align:right"><button class="btn bd" id="logout">🚪</button></div></div><div class="fx jc mb" style="position:relative"><button class="btn ${cls.color}" id="clsDD" style="color:#fff;border-color:#fff">🏫 ${cls.name} ${S.showDD?'▲':'▼'}</button>${S.showDD?renderClsDD():''}</div><div class="nav"><button class="${S.view==='manage'?'active bgb-c':'tbl'}" style="border-color:#457B9D" data-v="manage">⚙️ ${T.teacherMode}</button><button class="${S.view==='overview'?'active bgo-c':'tor'}" style="border-color:#F4A261" data-v="overview">📊 ${T.classOverview}</button><button class="${S.view==='progress'?'active bgk-c':'tpk'}" style="border-color:#F15BB5" data-v="progress">👤 ${T.studentProgress}</button><button class="${S.view==='leaderboard'?'active bgg-c':'tgn'}" style="border-color:#2A9D8F" data-v="leaderboard">🏆 ${T.leaderboard}</button></div></div><div class="cnt">${S.view==='manage'?renderManage():S.view==='overview'?renderOverview():S.view==='progress'?renderProgress():renderLeaderboard()}</div>${renderModals()}`}

function renderClsDD(){return`<div class="ddm" style="position:absolute;top:100%;left:50%;transform:translateX(-50%)"><div style="padding:8px;background:#FFFBEB;border-bottom:2px solid #FEF3C7;font-weight:700">${T.switchClass}</div>${S.data.classes.map(c=>`<div class="ddi fx ac jb" style="background:${c.id===S.data.activeClassId?'#DBEAFE':''}"><button class="f1" style="background:none;border:none;cursor:pointer;text-align:left" data-sw="${c.id}"><span class="icb ${c.color}" style="width:12px;height:12px;margin-right:4px"></span>${c.name}${c.id===S.data.activeClassId?' ✔':''}</button><button style="background:none;border:none;cursor:pointer" data-ec="${c.id}">✏️</button><button style="background:none;border:none;cursor:pointer" data-dc="${c.id}">🗑️</button></div>`).join('')}<button class="ddi bs" style="color:#fff;border-top:2px solid #2A9D8F" id="addClsDD">➕ ${T.addClass}</button></div>`}

function renderManage(){const acts=gActs(),sts=gSts();return`<div class="crd cp"><h2 class="tpu mb">✨ ${T.activities}</h2><button class="btn bpu" id="addAct">➕ ${T.addActivity}</button>${acts.length===0?`<p class="tgr tc">${T.noActivities}</p>`:acts.map(a=>`<div class="acr fx ac jb"><div class="fx ac"><span class="icb ${a.color}">${IC[a.icon]}</span><div><div>${a.name}</div><div class="tgr" style="font-size:.7rem">${a.pointValue} ${T.points}/次</div></div></div><div><button style="background:none;border:none;cursor:pointer" data-ea="${a.id}">✏️</button><button style="background:none;border:none;cursor:pointer" data-da="${a.id}">🗑️</button></div></div>`).join('')}</div><div class="crd cy"><h2 class="tbl mb">👥 ${T.students}</h2><button class="btn bs" id="addStu">➕ ${T.addStudent}</button><button class="btn bpu" id="impStu">⬆️ ${T.importStudents}</button></div>${sts.length===0?`<div class="crd cb tc tgr">${T.noStudents}</div>`:acts.length===0?`<div class="crd cb tc tgr">${T.noActivities}</div>`:sts.map(s=>`<div class="crd cb"><div class="fx jb ac mb"><strong>${s.name}</strong><button style="background:none;border:none;cursor:pointer" data-ds="${s.id}">🗑️</button></div>${acts.map(a=>{const c=s.activityCounts[a.id]||0;return`<div class="acr fx ac jb fw"><div class="fx ac"><span class="icb ${a.color}" style="width:1.5rem;height:1.5rem;font-size:.7rem">${IC[a.icon]}</span><div><div style="font-size:.8rem">${a.name}</div><div class="tgr" style="font-size:.7rem">${c*a.pointValue} ${T.points}</div></div></div><div class="fx ac" style="gap:4px"><button class="btn bd bsm" data-dec="${s.id}-${a.id}">−</button><input class="cin" type="number" value="${c}" min="0" data-cnt="${s.id}-${a.id}"><button class="btn bs bsm" data-inc="${s.id}-${a.id}">+</button></div></div>`}).join('')}<div class="fx jb ac" style="background:#FEF3C7;padding:8px;border-radius:.5rem;margin-top:8px"><span>${T.total}</span><span class="scb">${cTS(s)} 🏆</span></div></div>`).join('')}`}

function renderOverview(){const acts=gActs(),sts=gSts(),hba={};sts.forEach(s=>acts.forEach(a=>{(s.activityHistory?.[a.id]||[]).forEach(e=>{if(!hba[a.id])hba[a.id]={};if(!hba[a.id][e.date])hba[a.id][e.date]={count:0,points:0};hba[a.id][e.date].count+=e.count;hba[a.id][e.date].points+=e.points})}));return`<div class="crd co"><h2 class="tor mb">⬇️ ${T.exportData}</h2><button class="btn bp" id="expBtn">⬇️ ${T.exportData}</button><label class="btn bpu" style="cursor:pointer">⬆️ ${T.importData}<input type="file" accept=".json" id="impFile" style="display:none"></label></div><div class="crd co"><h2 class="tor mb">📊 ${T.classOverview}</h2>${acts.length===0?`<p class="tgr tc">${T.noActivities}</p>`:acts.map(a=>{const h=hba[a.id]||{},ds=Object.keys(h).sort().reverse(),tc=ds.reduce((s,d)=>s+h[d].count,0),tp=ds.reduce((s,d)=>s+h[d].points,0);return`<div class="acr"><div class="fx ac"><span class="icb ${a.color}">${IC[a.icon]}</span><div><div>${a.name}</div><div class="tgr" style="font-size:.7rem">${T.total}: ${tc} • ${tp} ${T.points}</div></div></div>${ds.length>0?`<div style="max-height:100px;overflow-y:auto;margin-top:8px">${ds.map(d=>`<div class="fx jb" style="font-size:.7rem;padding:4px;border-bottom:1px solid #eee"><span class="tgr">📅 ${d}</span><span>${h[d].count}× = ${h[d].points} ${T.points}</span></div>`).join('')}</div>`:`<p class="tgr tc" style="font-size:.7rem">${T.noHistory}</p>`}</div>`}).join('')}</div>`}

function renderProgress(){const sts=gSts(),acts=gActs();if(!S.selStu)return`<div class="crd cpk"><h2 class="tpk mb">👤 ${T.studentProgress}</h2>${sts.length===0?`<p class="tgr tc">${T.noStudents}</p>`:`<p class="tgr mb">${T.selectStudent}</p><div class="fx fw">${sts.map(s=>`<div class="stli" data-ss="${s.id}"><div style="font-size:1.5rem">👤</div><div>${s.name}</div><div class="tgr" style="font-size:.7rem">${cTS(s)} ${T.points}</div></div>`).join('')}</div>`}</div>`;const st=sts.find(s=>s.id===S.selStu);if(!st){S.selStu=null;return renderProgress()}const allD=new Set(),mx={};acts.forEach(a=>{mx[a.id]={};(st.activityHistory?.[a.id]||[]).forEach(e=>{allD.add(e.date);if(!mx[a.id][e.date])mx[a.id][e.date]={count:0,points:0};mx[a.id][e.date].count+=e.count;mx[a.id][e.date].points+=e.points})});const ds=[...allD].sort().reverse();return`<div class="crd cpk"><div class="fx ac jb mb fw" style="gap:8px"><div class="fx ac" style="gap:8px"><button class="btn bgr" id="backProg">◀ ${T.back}</button><select class="inp" id="stuSel" style="width:auto;margin:0;padding:8px">${sts.map(s=>`<option value="${s.id}"${s.id===S.selStu?' selected':''}>${s.name} (${cTS(s)})</option>`).join('')}</select></div><span class="scb">${cTS(st)} ⭐</span></div>${ds.length===0?`<div class="tc"><div style="font-size:2rem">📊</div><p class="tgr">${T.noHistory}</p></div>`:`<div class="mtx"><table><thead><tr><th>${T.activities}</th><th class="total-col">${T.total}</th>${ds.map(d=>`<th>${d.slice(5)}</th>`).join('')}</tr></thead><tbody>${acts.map(a=>{const rt=ds.reduce((s,d)=>s+(mx[a.id]?.[d]?.points||0),0);return`<tr><td><span class="icb ${a.color}" style="width:1rem;height:1rem;font-size:.5rem">${IC[a.icon]}</span>${a.name}</td><td class="total-col">${rt}</td>${ds.map(d=>{const c=mx[a.id]?.[d];return`<td class="${c?.points?'hasv':''}">${c?`${c.count}×`:'-'}</td>`}).join('')}</tr>`}).join('')}<tr class="total-row"><td><strong>${T.dailyTotal}</strong></td><td class="total-col">${cTS(st)}</td>${ds.map(d=>{const dt=acts.reduce((s,a)=>s+(mx[a.id]?.[d]?.points||0),0);return`<td>${dt}</td>`}).join('')}</tr></tbody></table></div>`}</div>`}

function renderLeaderboard(){const sts=gSts(),acts=gActs(),ss=[...sts].sort((a,b)=>{if(S.filter==='all')return cTS(b)-cTS(a);const ac=acts.find(x=>x.id===S.filter);return((b.activityCounts[S.filter]||0)*ac.pointValue)-((a.activityCounts[S.filter]||0)*ac.pointValue)}).filter(s=>S.filter==='all'||(s.activityCounts[S.filter]||0)>0);return`<div class="crd cg"><div class="fx jb ac mb fw" style="gap:8px"><h2 class="tgn">🏆 ${T.leaderboard} 🏆</h2>${acts.length>0?`<div class="fx ac" style="gap:4px"><span class="tgr">${T.filterBy}:</span><select class="inp" id="filterSel" style="width:auto;margin:0;padding:8px"><option value="all">${T.showAll}</option>${acts.map(a=>`<option value="${a.id}"${S.filter===a.id?' selected':''}>${a.name}</option>`).join('')}</select></div>`:''}</div>${sts.length===0||acts.length===0?`<p class="tgr tc">${sts.length===0?T.noStudents:T.noActivities}</p>`:ss.map((s,i)=>{const m=i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1),bg=i===0?'#FEF3C7':i===1?'#E5E7EB':i===2?'#FFEDD5':'#DBEAFE',bc=i===0?'#F9C74F':i===1?'#9CA3AF':i===2?'#F4A261':'#457B9D',sc=S.filter==='all'?cTS(s):(s.activityCounts[S.filter]||0)*acts.find(a=>a.id===S.filter).pointValue;return`<div class="lbi" style="background:${bg};border-color:${bc}"><div class="fx ac jb fw" style="gap:8px"><div class="fx ac"><span style="font-size:1.5rem;font-weight:900;margin-right:8px">${m}</span><strong>${s.name}</strong></div><div class="fx ac fw" style="gap:8px">${S.filter==='all'?acts.map(a=>{const c=s.activityCounts[a.id]||0;return`<div class="tc"><span class="icb ${a.color}" style="width:1.5rem;height:1.5rem;font-size:.7rem;margin:0 auto 4px;display:flex">${IC[a.icon]}</span><div style="font-size:.8rem">${c}×</div><div class="tgr" style="font-size:.7rem">${c*a.pointValue}</div></div>`}).join(''):''}<span class="scb">${sc} ⭐</span></div></div></div>`}).join('')}</div>`}

function renderModals(){let h='';if(S.modal==='addClass'){h+=`<div class="mdo"><div class="mdc" style="border-color:#457B9D"><h3 class="tbl mb">🏫 ${S.edit?'编辑':T.addClass}</h3><input class="inp" id="clsName" placeholder="${T.className}" value="${S.form.cls.name}"><div class="mb">${CO.map(c=>`<button class="clb ${c}${S.form.cls.color===c?' sel':''}" data-cc="${c}"></button>`).join('')}</div><button class="btn bs" id="saveCls">${T.save}</button><button class="btn bgr" id="canCls">${T.cancel}</button></div></div>`}
if(S.modal==='addStudent'){h+=`<div class="mdo"><div class="mdc" style="border-color:#2A9D8F"><h3 class="tgn mb">${T.addStudent}</h3><form id="stuForm"><input class="inp" id="stuName" placeholder="${T.studentName}" value="${S.form.stu}"><button class="btn bs">${T.save}</button><button type="button" class="btn bgr" id="canStu">${T.cancel}</button></form></div></div>`}
if(S.modal==='importStudents'){h+=`<div class="mdo"><div class="mdc" style="border-color:#9B5DE5"><h3 class="tpu mb">${T.importStudents}</h3><textarea class="inp" id="impTxt" placeholder="${T.pasteHere}" style="min-height:100px">${S.form.imp}</textarea><button class="btn bs" id="doImp">${T.save}</button><button class="btn bgr" id="canImp">${T.cancel}</button></div></div>`}
if(S.modal==='addActivity'){h+=`<div class="mdo"><div class="mdc" style="border-color:#F4A261"><h3 class="tor mb">${S.edit?'编辑':T.addActivity}</h3><input class="inp" id="actName" placeholder="${T.activityName}" value="${S.form.act.name}"><input class="inp" id="actPts" type="number" min="1" placeholder="${T.pointValue}" value="${S.form.act.pts}"><div class="mb">${Object.keys(IC).map(k=>`<button class="btn ${S.form.act.icon===k?'bo':'bp'}" data-ai="${k}">${IC[k]}</button>`).join('')}</div><div class="mb">${CO.map(c=>`<button class="clb ${c}${S.form.act.color===c?' sel':''}" data-ac="${c}"></button>`).join('')}</div><button class="btn bs" id="saveAct">${T.save}</button><button class="btn bgr" id="canAct">${T.cancel}</button></div></div>`}
if(S.modal==='backup'){h+=`<div class="mdo"><div class="mdc" style="border-color:#F9C74F;background:linear-gradient(135deg,#FEF3C7,#FFEDD5)"><div class="tc mb"><div style="font-size:2rem">⚠️</div><h3 class="tye">${T.backupTitle}</h3></div><p class="tgr mb">${T.backupMessage}</p><button class="btn bs" id="backNow">⬇️ ${T.backupNow}</button><button class="btn bgr" id="backLater">${T.backupLater}</button></div></div>`}
return h}

function bindEvents(){const lf=$('loginForm');if(lf){lf.onsubmit=e=>{e.preventDefault();const sys=JSON.parse(localStorage.getItem('chS')||'{}'),u=(sys.teachers||[]).find(t=>t.username===S.login.u&&t.password===S.login.p);if(u){S.user=u;S.loggedIn=1;S.login={u:'',p:''};load();render()}else alert('错误')};$('lu').oninput=e=>S.login.u=e.target.value;$('lp').oninput=e=>S.login.p=e.target.value}
const rf=$('regForm');if(rf){rf.onsubmit=e=>{e.preventDefault();if(!S.reg.n||!S.reg.u||!S.reg.p){alert('请填写所有字段');return}const sys=JSON.parse(localStorage.getItem('chS')||'{}');if((sys.teachers||[]).find(t=>t.username===S.reg.u)){alert('用户名已存在');return}const nu={id:Date.now().toString(),username:S.reg.u,password:S.reg.p,name:S.reg.n};sys.teachers=[...(sys.teachers||[]),nu];localStorage.setItem('chS',JSON.stringify(sys));S.user=nu;S.loggedIn=1;S.reg={n:'',u:'',p:''};render()};$('rn').oninput=e=>S.reg.n=e.target.value;$('ru').oninput=e=>S.reg.u=e.target.value;$('rp').oninput=e=>S.reg.p=e.target.value}
const lo=$('logout');if(lo)lo.onclick=()=>{S.loggedIn=0;S.user=null;S.data={activeClassId:null,classes:[],changes:0,lastBackup:0};render()};
const fc=$('firstCls');if(fc)fc.onclick=()=>{S.modal='addClass';render()};
const cd=$('clsDD');if(cd)cd.onclick=()=>{S.showDD=!S.showDD;render()};
document.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{S.data.activeClassId=b.dataset.sw;S.showDD=0;render()});
document.querySelectorAll('[data-ec]').forEach(b=>b.onclick=e=>{e.stopPropagation();const c=S.data.classes.find(x=>x.id===b.dataset.ec);S.edit=c;S.form.cls={name:c.name,color:c.color};S.modal='addClass';S.showDD=0;render()});
document.querySelectorAll('[data-dc]').forEach(b=>b.onclick=e=>{e.stopPropagation();if(!confirm('确定？'))return;S.data.classes=S.data.classes.filter(c=>c.id!==b.dataset.dc);if(S.data.activeClassId===b.dataset.dc)S.data.activeClassId=S.data.classes[0]?.id||null;inc();render()});
const acd=$('addClsDD');if(acd)acd.onclick=()=>{S.edit=null;S.form.cls={name:'',color:'bgb-c'};S.modal='addClass';S.showDD=0;render()};
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;S.selStu=null;render()});
const aa=$('addAct');if(aa)aa.onclick=()=>{S.edit=null;S.form.act={name:'',icon:'Star',color:'bgb-c',pts:10};S.modal='addActivity';render()};
const as=$('addStu');if(as)as.onclick=()=>{S.modal='addStudent';render()};
const is=$('impStu');if(is)is.onclick=()=>{S.modal='importStudents';render()};
document.querySelectorAll('[data-ea]').forEach(b=>b.onclick=()=>{const a=gActs().find(x=>x.id===b.dataset.ea);S.edit=a;S.form.act={name:a.name,icon:a.icon,color:a.color,pts:a.pointValue};S.modal='addActivity';render()});
document.querySelectorAll('[data-da]').forEach(b=>b.onclick=()=>{if(!confirm('确定？'))return;const cls=gCls();cls.activities=cls.activities.filter(a=>a.id!==b.dataset.da);cls.students.forEach(s=>{delete s.activityCounts[b.dataset.da];delete s.activityHistory[b.dataset.da]});inc();render()});
document.querySelectorAll('[data-ds]').forEach(b=>b.onclick=()=>{if(!confirm('确定？'))return;gCls().students=gCls().students.filter(s=>s.id!==parseFloat(b.dataset.ds));inc();render()});
document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{const[sid,aid]=b.dataset.dec.split('-'),s=gSts().find(x=>x.id===parseFloat(sid));if(s)s.activityCounts[aid]=Math.max(0,(s.activityCounts[aid]||0)-1);inc();render()});
document.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{const[sid,aid]=b.dataset.inc.split('-'),s=gSts().find(x=>x.id===parseFloat(sid)),a=gActs().find(x=>x.id===aid);if(s&&a){s.activityCounts[aid]=(s.activityCounts[aid]||0)+1;if(!s.activityHistory[aid])s.activityHistory[aid]=[];s.activityHistory[aid].push({date:getDate(),count:1,points:a.pointValue})}inc();render()});
document.querySelectorAll('[data-cnt]').forEach(i=>i.onchange=e=>{const[sid,aid]=i.dataset.cnt.split('-'),s=gSts().find(x=>x.id===parseFloat(sid));if(s)s.activityCounts[aid]=Math.max(0,parseInt(e.target.value)||0);inc();render()});
const cn=$('clsName');if(cn)cn.oninput=e=>S.form.cls.name=e.target.value;
document.querySelectorAll('[data-cc]').forEach(b=>b.onclick=()=>{S.form.cls.color=b.dataset.cc;render()});
const sc=$('saveCls');if(sc)sc.onclick=()=>{if(!S.form.cls.name.trim())return;if(S.edit){const c=S.data.classes.find(x=>x.id===S.edit.id);if(c){c.name=S.form.cls.name.trim();c.color=S.form.cls.color}}else{const nc={id:Date.now().toString(),name:S.form.cls.name.trim(),color:S.form.cls.color,students:[],activities:[]};S.data.classes.push(nc);S.data.activeClassId=nc.id}S.form.cls={name:'',color:'bgb-c'};S.modal=null;S.edit=null;inc();render()};
const cc=$('canCls');if(cc)cc.onclick=()=>{S.modal=null;S.edit=null;render()};
const sf=$('stuForm');if(sf)sf.onsubmit=e=>{e.preventDefault();if(!S.form.stu.trim())return;const cls=gCls(),ac={},ah={};cls.activities.forEach(a=>{ac[a.id]=0;ah[a.id]=[]});cls.students.push({id:Date.now()+Math.random(),name:S.form.stu.trim(),activityCounts:ac,activityHistory:ah});S.form.stu='';S.modal=null;inc();render()};
const sn=$('stuName');if(sn)sn.oninput=e=>S.form.stu=e.target.value;
const cs=$('canStu');if(cs)cs.onclick=()=>{S.modal=null;render()};
const it=$('impTxt');if(it)it.oninput=e=>S.form.imp=e.target.value;
const di=$('doImp');if(di)di.onclick=()=>{const ns=S.form.imp.split(/[\n,]+/).map(n=>n.trim()).filter(n=>n),cls=gCls();ns.forEach(n=>{const ac={},ah={};cls.activities.forEach(a=>{ac[a.id]=0;ah[a.id]=[]});cls.students.push({id:Date.now()+Math.random(),name:n,activityCounts:ac,activityHistory:ah})});S.form.imp='';S.modal=null;inc();render()};
const ci=$('canImp');if(ci)ci.onclick=()=>{S.modal=null;render()};
const an=$('actName');if(an)an.oninput=e=>S.form.act.name=e.target.value;
const ap=$('actPts');if(ap)ap.oninput=e=>S.form.act.pts=e.target.value;
document.querySelectorAll('[data-ai]').forEach(b=>b.onclick=()=>{S.form.act.icon=b.dataset.ai;render()});
document.querySelectorAll('[data-ac]').forEach(b=>b.onclick=()=>{S.form.act.color=b.dataset.ac;render()});
const sa=$('saveAct');if(sa)sa.onclick=()=>{if(!S.form.act.name.trim()||S.form.act.pts<=0)return;const cls=gCls();if(S.edit){const a=cls.activities.find(x=>x.id===S.edit.id);if(a){a.name=S.form.act.name;a.icon=S.form.act.icon;a.color=S.form.act.color;a.pointValue=parseInt(S.form.act.pts)||10}}else{const na={id:Date.now().toString(),name:S.form.act.name,icon:S.form.act.icon,color:S.form.act.color,pointValue:parseInt(S.form.act.pts)||10};cls.activities.push(na);cls.students.forEach(s=>{s.activityCounts[na.id]=0;s.activityHistory[na.id]=[]})}S.form.act={name:'',icon:'Star',color:'bgb-c',pts:10};S.modal=null;S.edit=null;inc();render()};
const ca=$('canAct');if(ca)ca.onclick=()=>{S.modal=null;S.edit=null;render()};
const eb=$('expBtn');if(eb)eb.onclick=()=>{const d={version:'2.0',exportDate:new Date().toISOString(),teacher:S.user.name||S.user.username,data:S.data},b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='课堂英雄-'+Date.now()+'.json';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);S.data.lastBackup=S.data.changes;save();alert(T.dataExported)};
const ib=$('impFile');if(ib)ib.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.data?.classes){S.data=d.data;save();alert(T.dataImported);render()}else alert(T.invalidFile)}catch{alert(T.invalidFile)}};r.readAsText(f)};
document.querySelectorAll('[data-ss]').forEach(b=>b.onclick=()=>{S.selStu=parseFloat(b.dataset.ss);render()});
const bp=$('backProg');if(bp)bp.onclick=()=>{S.selStu=null;render()};
const ss=$('stuSel');if(ss)ss.onchange=e=>{S.selStu=parseFloat(e.target.value);render()};
const fs=$('filterSel');if(fs)fs.onchange=e=>{S.filter=e.target.value;render()};
const bn=$('backNow');if(bn)bn.onclick=()=>{const d={version:'2.0',exportDate:new Date().toISOString(),teacher:S.user.name||S.user.username,data:S.data},b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='课堂英雄-'+Date.now()+'.json';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);S.data.lastBackup=S.data.changes;S.modal=null;save();alert(T.dataExported);render()};
const bl=$('backLater');if(bl)bl.onclick=()=>{S.modal=null;render()}}
render();
</script>
</body>
</html>
